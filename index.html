                hasLumberjack: true,   // lumberjack threat
                hasXPBar: true         // master gardener XP bar
            }
        };

        const GAME_CONSTANTS = {
            TARGET_WIDTH: 480,
            TARGET_HEIGHT: 640,
            MAX_GROWTH: 1000, // Changed to 1000 for progress bar
            MAX_HEARTS: 3,
            PLAYER_SPEED: 5
        };

        // ===== GAME STATE MANAGER =====
        class GameState {
            constructor() {
                this.state = 'start';
                this.difficulty = 'easy';
                this.growth = 0;
                this.hearts = GAME_CONSTANTS.MAX_HEARTS;
                this.score = 0;
                this.shake = 0;
                this.playerName = '';
                this.combo = 0;
                this.maxCombo = 0;
                this.shieldActive = false;
                this.shieldDuration = 0;
                // Day/Night (Easy+)
                this.timeOfDay = 0;          // 0–1 cycles through day/dusk/night/dawn
                // Bee (Medium+)
                this.beeActive = false;
                this.beeX = 0; this.beeY = 0;
                this.beeDX = 0; this.beeDY = 0;
                this.beeTimer = 0;           // countdown until next bee spawns
                this.sunMultiplier = 1;
                this.sunMultiplierTimer = 0;
                // Acid Rain (Hard)
                this.acidRainState = 'idle'; // 'idle' | 'warning' | 'raining'
                this.acidRainTimer = 0;
                this.acidRainWarningTimer = 0;
                this.acidDrainTimer = 0;
                // Lumberjack (Hard)
                this.lumberjack = null;      // null or { x,y,state,timer,stunTimer,clicksNeeded }
                this.lumberjackCooldown = 0;
                // XP Bar (Hard)
                this.xp = 0;
                this.xpMax = 500;
                this.lastGrowthStage = 0;
                // Pressure system (Hard) — ramps up as player nears victory
                this.pressureLevel = 0;  // 0=none, 1=danger(70%), 2=critical(85%), 3=finalPush(93%)
                this.pressureAlertTimer = 0; // show alert for N frames when tier changes
            }

            reset() {
                this.growth = 0;
                this.hearts = GAME_CONSTANTS.MAX_HEARTS;
                this.score = 0;
                this.shake = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.shieldActive = false;
                this.shieldDuration = 0;
                this.timeOfDay = 0;
                this.beeActive = false;
                this.beeTimer = 600 + Math.random() * 600;
                this.beeAutoTimer = 0;
                this.sunMultiplier = 1;
                this.sunMultiplierTimer = 0;
                this.acidRainState = 'idle';
                this.acidRainTimer = 1800 + Math.random() * 1200; // first rain after 30-50s
                this.acidRainWarningTimer = 0;
                this.acidDrainTimer = 0;
                this.lumberjack = null;
                this.lumberjackCooldown = 900 + Math.random() * 600; // first jack after 15-25s
                this.xp = 0;
                this.xpMax = 500;
                this.lastGrowthStage = 0;
                this.pressureLevel = 0;
                this.pressureAlertTimer = 0;
            }

            addGrowth(multiplier = 1) {
                if (this.combo > this.maxCombo) this.maxCombo = this.combo;

                let points = 100;
                if (this.combo >= 3) points += 50;
                if (this.combo >= 5) points += 50;
                if (this.combo >= 10) points += 100;

                this.growth += Math.round(points * multiplier);
                if (this.growth >= GAME_CONSTANTS.MAX_GROWTH) {
                    this.growth = GAME_CONSTANTS.MAX_GROWTH;
                    this.state = 'win';
                }
            }

            loseHeart() {
                // If shield is active, just remove shield instead
                if (this.shieldActive) {
                    this.shieldActive = false;
                    this.shieldDuration = 0;
                    this.shake = 5; // Lighter shake for shield hit
                    this.combo = 0; // Reset combo
                    return;
                }

                this.hearts--;
                this.shake = 10;
                // Decrease growth by half when hit by pest
                this.growth = Math.floor(this.growth / 2);
                this.combo = 0; // Reset combo on hit
                if (this.hearts <= 0) {
                    this.state = 'lose';
                }
            }

            activateShield() {
                this.shieldActive = true;
                this.shieldDuration = 300; // 5 seconds at 60fps
            }

            updateShield() {
                if (this.shieldActive && this.shieldDuration > 0) {
                    this.shieldDuration--;
                    if (this.shieldDuration <= 0) {
                        this.shieldActive = false;
                    }
                }
            }

            getHealthPercent() {
                return (this.hearts / GAME_CONSTANTS.MAX_HEARTS) * 100;
            }

            getGrowthPercent() {
                return (this.growth / GAME_CONSTANTS.MAX_GROWTH) * 100;
            }
        }

        // ===== PLAYER CLASS =====
        class Player {
            constructor(canvas, difficulty, images) {
                this.width = 80;
                this.height = 120;
                this.x = (canvas.width - this.width) / 2;
                this.y = canvas.height - this.height - 10;
                this.speed = GAME_CONSTANTS.PLAYER_SPEED;
                this.targetX = this.x;
                this.difficulty = difficulty;
                this.images = images;
            }

            update(canvas) {
                const diff = this.targetX - this.x;
                this.x += diff * 0.2;
                this.x = Math.max(0, Math.min(canvas.width - this.width, this.x));
            }

            moveLeft() {
                this.targetX = Math.max(0, this.targetX - 50);
            }

            moveRight(canvasWidth) {
                this.targetX = Math.min(canvasWidth - this.width, this.targetX + 50);
            }

            getGrowthStage(growth) {
                // Define growth stages based on score
                // 0: Just soil (0-100)
                // 1: Stem appears (100-250)
                // 2: First leaf (250-400)
                // 3: Second leaf (400-600)
                // 4: Petals forming (600-800)
                // 5: Full flower (800-1000)

                if (growth < 100) return 0;
                if (growth < 250) return 1;
                if (growth < 400) return 2;
                if (growth < 600) return 3;
                if (growth < 800) return 4;
                return 5;
            }

            draw(ctx, growth) {
                const stage = this.getGrowthStage(growth);
                const centerX = this.x + this.width / 2;
                const potTop = this.y + 70;

                // Draw flower pot
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(this.x + 15, potTop, 50, 30);
                ctx.fillStyle = '#A0522D';
                ctx.fillRect(this.x + 10, potTop, 60, 5);

                // Draw soil
                ctx.fillStyle = '#654321';
                ctx.fillRect(this.x + 15, potTop, 50, 8);

                // Stage 0: Just soil (nothing grows yet)
                if (stage === 0) {
                    return;
                }

                // Stage 1: Stem appears
                if (stage >= 1) {
                    ctx.fillStyle = '#2E7D32';
                    ctx.fillRect(centerX - 3, potTop - 25, 6, 30);
                }

                // Stage 2: First leaf (left side)
                if (stage >= 2) {
                    ctx.fillStyle = '#4CAF50';
                    // Left leaf
                    ctx.beginPath();
                    ctx.ellipse(centerX - 15, potTop - 15, 12, 8, -Math.PI / 4, 0, Math.PI * 2);
                    ctx.fill();

                    // Leaf vein
                    ctx.strokeStyle = '#2E7D32';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(centerX - 3, potTop - 15);
                    ctx.lineTo(centerX - 20, potTop - 15);
                    ctx.stroke();
                }

                // Stage 3: Second leaf (right side)
                if (stage >= 3) {
                    ctx.fillStyle = '#4CAF50';
                    // Right leaf
                    ctx.beginPath();
                    ctx.ellipse(centerX + 15, potTop - 25, 12, 8, Math.PI / 4, 0, Math.PI * 2);
                    ctx.fill();

                    // Leaf vein
                    ctx.strokeStyle = '#2E7D32';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(centerX + 3, potTop - 25);
                    ctx.lineTo(centerX + 20, potTop - 25);
                    ctx.stroke();

                    // Extend stem
                    ctx.fillStyle = '#2E7D32';
                    ctx.fillRect(centerX - 3, potTop - 45, 6, 20);
                }

                // Stage 4: Petals forming (small flower bud)
                if (stage >= 4) {
                    // Extend stem more
                    ctx.fillStyle = '#2E7D32';
                    ctx.fillRect(centerX - 3, potTop - 60, 6, 15);

                    // Small bud
                    const budY = potTop - 60;

                    if (this.difficulty === 'easy') {
                        // Lotus bud - pink
                        ctx.fillStyle = '#FFB3D9';
                        ctx.beginPath();
                        ctx.arc(centerX, budY, 8, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (this.difficulty === 'medium') {
                        // Lily bud - orange
                        ctx.fillStyle = '#FF9800';
                        ctx.beginPath();
                        ctx.arc(centerX, budY, 8, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        // Rose bud - red
                        ctx.fillStyle = '#E57373';
                        ctx.beginPath();
                        ctx.arc(centerX, budY, 8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Stage 5: Full flower bloom!
                if (stage >= 5) {
                    const flowerY = potTop - 70;

                    ctx.font = '48px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    if (this.difficulty === 'easy') {
                        ctx.fillText('🌸', centerX, flowerY);
                    } else if (this.difficulty === 'medium') {
                        ctx.fillText('🌺', centerX, flowerY);
                    } else {
                        ctx.fillText('🌹', centerX, flowerY);
                    }
                }
            }

            getBounds() {
                return {
                    x: this.x + 10,
                    y: this.y,
                    width: this.width - 20,
                    height: this.height - 10
                };
            }
        }

        // ===== FALLING OBJECT CLASS =====
        class FallingObject {
            constructor(canvas, type, speed, pressureLevel = 0) {
                this.type = type; // 'water', 'sun', 'pest', 'shield', or 'worm'
                this.pressureLevel = pressureLevel;

                // Sun and water shrink under pressure — harder to catch
                const shrink = (type === 'sun' || type === 'water')
                    ? [1, 0.78, 0.58, 0.42][pressureLevel] : 1;

                const baseSize = type === 'worm' ? 44 : 35;
                this.width = Math.round(baseSize * shrink);
                this.height = Math.round(baseSize * shrink);

                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height;
                this.speed = type === 'worm' ? speed * 0.75 : speed;
                this.active = true;
                this.rotation = Math.random() * Math.PI * 2;
                this.wiggle = 0;
            }

            update(canvas) {
                this.y += this.speed;
                this.rotation += 0.05;
                this.wiggle += 0.18; // wiggle counter for worm
                if (this.y > canvas.height) {
                    this.active = false;
                }
            }

            draw(ctx) {
                ctx.save();

                // Worm wiggles side to side as it falls
                const drawX = this.type === 'worm'
                    ? this.x + Math.sin(this.wiggle) * 6
                    : this.x;

                ctx.translate(drawX + this.width / 2, this.y + this.height / 2);

                // Scale sun/water visually to match their shrunk hitbox under pressure
                const visualScale = (this.type === 'sun' || this.type === 'water')
                    ? [1, 0.78, 0.58, 0.42][this.pressureLevel || 0] : 1;
                if (visualScale !== 1) ctx.scale(visualScale, visualScale);

                // Under pressure 2+, add a red-tinted warning glow to sun/water
                if ((this.type === 'sun' || this.type === 'water') && (this.pressureLevel || 0) >= 2) {
                    ctx.shadowColor = this.pressureLevel >= 3 ? '#FF0000' : '#FF6600';
                    ctx.shadowBlur = 8;
                }

                if (this.type === 'water') {
                    // Water drop - pixelated style
                    ctx.fillStyle = '#2980B9';
                    ctx.fillRect(-8, -8, 16, 8);
                    ctx.fillRect(-12, -4, 20, 12);
                    ctx.fillRect(-8, 8, 16, 6);

                    ctx.fillStyle = '#3498DB';
                    ctx.fillRect(-6, -6, 12, 6);
                    ctx.fillRect(-10, -2, 16, 10);
                    ctx.fillRect(-6, 8, 12, 4);

                    ctx.fillStyle = '#5DADE2';
                    ctx.fillRect(-4, -4, 6, 4);
                    ctx.fillRect(-2, -2, 3, 2);
                } else if (this.type === 'sun') {
                    const fontSize = Math.round(32 / (visualScale || 1));
                    ctx.font = `${fontSize}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('☀️', 0, 0);
                } else if (this.type === 'shield') {
                    // Shield power-up
                    ctx.font = '32px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🛡️', 0, 0);
                } else if (this.type === 'worm') {
                    // Friendly pixelated worm — green segmented body, smiley face, sparkles
                    const w = this.wiggle;

                    // Glow aura
                    ctx.shadowColor = '#7CFC00';
                    ctx.shadowBlur = 10;

                    // Body segments (3 segments)
                    const segColors = ['#5DBB3F', '#6ECF50', '#5DBB3F'];
                    const segOffsets = [
                        { x: Math.sin(w) * 3, y: -8 },
                        { x: Math.sin(w + 1.2) * 3, y: 2 },
                        { x: Math.sin(w + 2.4) * 3, y: 12 },
                    ];
                    segOffsets.forEach(({ x, y }, i) => {
                        ctx.fillStyle = segColors[i];
                        ctx.beginPath();
                        ctx.arc(x, y, 8, 0, Math.PI * 2);
                        ctx.fill();
                        // Segment highlight
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        ctx.beginPath();
                        ctx.arc(x - 2, y - 2, 3, 0, Math.PI * 2);
                        ctx.fill();
                    });

                    ctx.shadowBlur = 0;

                    // Head (top segment, larger)
                    const hx = Math.sin(w) * 3;
                    const hy = -18;
                    ctx.fillStyle = '#7CFC00';
                    ctx.beginPath();
                    ctx.arc(hx, hy, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#3A8A1A';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Eyes
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(hx - 3, hy - 2, 3, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(hx + 3, hy - 2, 3, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(hx - 3, hy - 2, 1.5, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(hx + 3, hy - 2, 1.5, 0, Math.PI * 2); ctx.fill();

                    // Smile
                    ctx.strokeStyle = '#2E6A10';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(hx, hy + 1, 4, 0.2, Math.PI - 0.2);
                    ctx.stroke();

                    // Sparkle stars around worm
                    ctx.fillStyle = '#FFD700';
                    const sparkles = [
                        { x: -14, y: -12 }, { x: 14, y: -8 }, { x: -12, y: 8 }
                    ];
                    sparkles.forEach(({ x, y }) => {
                        const pulse = 0.6 + Math.abs(Math.sin(w * 2 + x)) * 0.4;
                        ctx.globalAlpha = pulse;
                        ctx.fillRect(x - 2, y - 2, 4, 4);
                        ctx.fillRect(x, y - 4, 2, 8); // vertical
                        ctx.fillRect(x - 4, y, 8, 2); // horizontal
                    });
                    ctx.globalAlpha = 1;

                } else {
                    // Pest/Bug
                    ctx.font = '32px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🐛', 0, 0);
                }

                ctx.restore();
            }

            getBounds() {
                return {
                    x: this.x + 5,
                    y: this.y + 5,
                    width: this.width - 10,
                    height: this.height - 10
                };
            }
        }

        // ===== POPUP NOTIFICATION =====
        class PopupNotification {
            constructor(text, x, y, color = '#FFD700') {
                this.text = text;
                this.x = x;
                this.y = y;
                this.startY = y;
                this.color = color;
                this.life = 60; // 1 second at 60fps
                this.maxLife = 60;
                this.scale = 0;
            }

            update() {
                this.life--;
                // Pop in animation (first 10 frames)
                if (this.life > 50) {
                    this.scale = (60 - this.life) / 10;
                }
                // Stay visible (frames 50-20)
                else if (this.life > 20) {
                    this.scale = 1;
                }
                // Fade out and float up (last 20 frames)
                else {
                    this.scale = this.life / 20;
                    this.y -= 2; // Float upward
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.scale;

                // Shadow/outline for better visibility
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 4;
                ctx.font = 'bold 24px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeText(this.text, this.x, this.y);

                // Main text
                ctx.fillStyle = this.color;
                ctx.fillText(this.text, this.x, this.y);

                ctx.restore();
            }

            isAlive() {
                return this.life > 0;
            }
        }

        // ===== PARTICLE EFFECT =====
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4 - 2;
                this.life = 30;
                this.maxLife = 30;
                this.color = color;
                this.size = Math.random() * 4 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2;
                this.life--;
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }

            isAlive() {
                return this.life > 0;
            }
        }

        // ===== COLOUR HELPER =====
        function lerpColor(a, b, t) {
            const ah = a.replace('#', ''), bh = b.replace('#', '');
            const ar = parseInt(ah.slice(0, 2), 16), ag = parseInt(ah.slice(2, 4), 16), ab = parseInt(ah.slice(4, 6), 16);
            const br = parseInt(bh.slice(0, 2), 16), bg = parseInt(bh.slice(2, 4), 16), bb = parseInt(bh.slice(4, 6), 16);
            const r = Math.round(ar + (br - ar) * t).toString(16).padStart(2, '0');
            const g = Math.round(ag + (bg - ag) * t).toString(16).padStart(2, '0');
            const bl2 = Math.round(ab + (bb - ab) * t).toString(16).padStart(2, '0');
            return `#${r}${g}${bl2}`;
        }

        // ===== LUMBERJACK (Hard Mode) =====
        class Lumberjack {
            constructor(canvas) {
                this.canvas = canvas;
                this.width = 48;
                this.height = 64;
                // Start from a random bottom-edge position
                this.x = Math.random() * (canvas.width - this.width);
                this.y = canvas.height + this.height; // starts off-screen below
                this.targetY = canvas.height - this.height - 20; // walks up to plant level
                this.state = 'walking'; // 'walking' | 'threatening' | 'stunned' | 'fleeing' | 'chopping'
                this.timer = 180;       // frames until he chops (3s at 60fps)
                this.stunTimer = 0;
                this.clicksNeeded = 4;  // hits to stun
                this.clicksLanded = 0;
                this.starAngle = 0;
                this.animFrame = 0;
                this.animTimer = 0;
                this.footStep = 0;
            }

            update() {
                this.animTimer++;
                if (this.animTimer % 12 === 0) this.animFrame = (this.animFrame + 1) % 4;
                this.starAngle += 0.15;

                if (this.state === 'walking') {
                    this.y -= 2.5;
                    if (this.y <= this.targetY) {
                        this.y = this.targetY;
                        this.state = 'threatening';
                    }
                } else if (this.state === 'threatening') {
                    this.timer--;
                    if (this.timer <= 0) {
                        this.state = 'chopping';
                        this.timer = 40; // frames for chop animation
                    }
                } else if (this.state === 'stunned') {
                    this.stunTimer--;
                    if (this.stunTimer <= 0) {
                        this.state = 'fleeing';
                    }
                } else if (this.state === 'fleeing') {
                    this.y += 4;
                } else if (this.state === 'chopping') {
                    this.timer--;
                }
            }

            isGone() {
                return this.state === 'fleeing' && this.y > this.canvas.height + this.height + 20;
            }

            isChopped() {
                return this.state === 'chopping' && this.timer <= 0;
            }

            handleClick(cx, cy) {
                // Hit box around lumberjack
                if (cx >= this.x - 10 && cx <= this.x + this.width + 10 &&
                    cy >= this.y - 10 && cy <= this.y + this.height + 10) {
                    if (this.state === 'threatening') {
                        this.clicksLanded++;
                        SoundEngine.lumberjackHit();
                        if (this.clicksLanded >= this.clicksNeeded) {
                            this.state = 'stunned';
                            this.stunTimer = 120; // 2 seconds stunned then flees
                        }
                        return true;
                    }
                }
                return false;
            }

            draw(ctx) {
                const cx = this.x + this.width / 2;
                const by = this.y + this.height; // bottom y

                ctx.save();

                // Leg walk animation
                const legSwing = Math.sin(this.animFrame * Math.PI / 2) * 8;

                // === LEGS ===
                ctx.fillStyle = '#5D4037'; // brown pants
                if (this.state === 'walking' || this.state === 'fleeing') {
                    ctx.fillRect(cx - 14, by - 24, 10, 22 + legSwing);
                    ctx.fillRect(cx + 4, by - 24, 10, 22 - legSwing);
                } else {
                    ctx.fillRect(cx - 14, by - 24, 10, 22);
                    ctx.fillRect(cx + 4, by - 24, 10, 22);
                }

                // === BOOTS ===
                ctx.fillStyle = '#212121';
                ctx.fillRect(cx - 16, by - 6, 14, 8);
                ctx.fillRect(cx + 2, by - 6, 14, 8);

                // === BODY ===
                ctx.fillStyle = '#C62828'; // red flannel
                ctx.fillRect(cx - 14, by - 52, 28, 30);
                // Flannel stripes
                ctx.fillStyle = '#B71C1C';
                for (let i = 0; i < 3; i++) {
                    ctx.fillRect(cx - 14, by - 52 + i * 10, 28, 4);
                }

                // === ARMS ===
                ctx.fillStyle = '#C62828';
                const armSwing = this.state === 'threatening' ? Math.sin(Date.now() / 200) * 15 : 0;
                const chopAngle = this.state === 'chopping' ? -60 : 0;

                // Left arm
                ctx.save();
                ctx.translate(cx - 14, by - 48);
                ctx.rotate((-0.3 + armSwing * 0.02) * Math.PI / 180 * 10);
                ctx.fillRect(-6, 0, 10, 22);
                ctx.restore();

                // Right arm (holds axe)
                ctx.save();
                ctx.translate(cx + 14, by - 48);
                ctx.rotate((0.3 + chopAngle * 0.02 - armSwing * 0.02) * Math.PI / 180 * 10);
                ctx.fillRect(-4, 0, 10, 22);

                // === AXE ===
                // Handle
                ctx.fillStyle = '#8D6E63';
                ctx.fillRect(-2, 14, 6, 28);
                // Head
                ctx.fillStyle = '#90A4AE';
                ctx.fillRect(-10, 6, 16, 14);
                ctx.fillStyle = '#607D8B';
                ctx.fillRect(-12, 4, 6, 18);
                ctx.restore();

                // === HEAD ===
                ctx.fillStyle = '#FFCCBC'; // skin
                ctx.fillRect(cx - 12, by - 68, 24, 20);

                // Eyes (angry)
                ctx.fillStyle = '#000';
                ctx.fillRect(cx - 7, by - 62, 4, 4);
                ctx.fillRect(cx + 3, by - 62, 4, 4);
                // Angry eyebrows
                ctx.fillStyle = '#5D4037';
                ctx.fillRect(cx - 9, by - 67, 6, 3);
                ctx.fillRect(cx + 3, by - 67, 6, 3);
                // Mouth (grimace)
                ctx.fillStyle = '#5D4037';
                ctx.fillRect(cx - 5, by - 54, 10, 3);

                // === HAT ===
                ctx.fillStyle = '#4E342E';
                ctx.fillRect(cx - 14, by - 76, 28, 10);
                ctx.fillRect(cx - 10, by - 86, 20, 12);

                // === STUNNED STARS ===
                if (this.state === 'stunned') {
                    for (let i = 0; i < 3; i++) {
                        const angle = this.starAngle + (i * Math.PI * 2 / 3);
                        const sx = cx + Math.cos(angle) * 22;
                        const sy = (this.y + 5) + Math.sin(angle) * 10;
                        ctx.fillStyle = '#FFD700';
                        ctx.font = '16px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('⭐', sx, sy);
                    }
                    ctx.textBaseline = 'alphabetic';
                }

                // === PROGRESS BAR (how close to chopping) ===
                if (this.state === 'threatening') {
                    const barW = 52;
                    const barX = this.x - 2;
                    const barY = this.y - 18;
                    const progress = 1 - (this.timer / 180);
                    const flash = Math.floor(Date.now() / 200) % 2 === 0;

                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(barX, barY, barW, 10);
                    ctx.fillStyle = progress > 0.66 ? '#F44336' : progress > 0.33 ? '#FF9800' : '#FFEB3B';
                    ctx.fillRect(barX, barY, barW * progress, 10);
                    ctx.strokeStyle = flash ? '#fff' : '#000';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(barX, barY, barW, 10);

                    // Click count indicator
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 8px "Press Start 2P"';
                    ctx.textAlign = 'center';
                    const remaining = this.clicksNeeded - this.clicksLanded;
                    ctx.fillText(`CLICK x${remaining}!`, cx, barY - 4);
                }

                ctx.restore();
            }
        }

        // ===== GAME ENGINE =====
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.gameState = new GameState();
                this.player = null;
                this.fallingObjects = [];
                this.particles = [];
                this.popups = [];
                this.lastSpawn = 0;
                this.nextSpawnDelay = 1000;
                this.lumberjack = null;        // Hard mode lumberjack
                this.prevGrowthStage = 0;      // for fanfare detection

                this.setupCanvas();
                this.setupControls();
                this.setupUI();

                this.animate = this.animate.bind(this);
                requestAnimationFrame(this.animate);
            }

            setupCanvas() {
                const updateCanvasSize = () => {
                    const container = document.getElementById('gameContainer');
                    const aspectRatio = GAME_CONSTANTS.TARGET_WIDTH / GAME_CONSTANTS.TARGET_HEIGHT;

                    let width = window.innerWidth;
                    let height = window.innerHeight;

                    if (width / height > aspectRatio) {
                        width = height * aspectRatio;
                    } else {
                        height = width / aspectRatio;
                    }

                    this.canvas.width = GAME_CONSTANTS.TARGET_WIDTH;
                    this.canvas.height = GAME_CONSTANTS.TARGET_HEIGHT;
                    this.canvas.style.width = width + 'px';
                    this.canvas.style.height = height + 'px';

                    container.style.width = width + 'px';
                    container.style.height = height + 'px';
                };

                updateCanvasSize();
                window.addEventListener('resize', updateCanvasSize);
            }

            setupControls() {
                document.addEventListener('keydown', (e) => {
                    if (this.gameState.state !== 'playing' || !this.player) return;

                    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                        this.player.moveLeft();
                    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                        this.player.moveRight(this.canvas.width);
                    }
                });

                this.canvas.addEventListener('touchstart', (e) => {
                    if (this.gameState.state !== 'playing' || !this.player) return;
                    e.preventDefault();

                    const touch = e.touches[0];
                    const rect = this.canvas.getBoundingClientRect();
                    const x = (touch.clientX - rect.left) * (this.canvas.width / rect.width);
                    const y = (touch.clientY - rect.top) * (this.canvas.height / rect.height);

                    // Check lumberjack click first
                    if (this.lumberjack && this.lumberjack.handleClick(x, y)) return;

                    // Check bee click
                    if (this.gameState.beeActive) {
                        const bx = this.gameState.beeX, by = this.gameState.beeY;
                        if (Math.abs(x - bx) < 24 && Math.abs(y - by) < 24) {
                            this.activateBeeBoost();
                            return;
                        }
                    }

                    if (x < this.canvas.width / 2) {
                        this.player.moveLeft();
                    } else {
                        this.player.moveRight(this.canvas.width);
                    }
                });

                // Mouse click for bee & lumberjack on desktop
                this.canvas.addEventListener('click', (e) => {
                    if (this.gameState.state !== 'playing' || !this.player) return;
                    const rect = this.canvas.getBoundingClientRect();
                    const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
                    const y = (e.clientY - rect.top) * (this.canvas.height / rect.height);

                    if (this.lumberjack && this.lumberjack.handleClick(x, y)) return;

                    if (this.gameState.beeActive) {
                        const bx = this.gameState.beeX, by = this.gameState.beeY;
                        if (Math.abs(x - bx) < 24 && Math.abs(y - by) < 24) {
                            this.activateBeeBoost();
                        }
                    }
                });

                document.querySelectorAll('.difficulty-card').forEach(card => {
                    card.addEventListener('click', () => {
                        document.querySelectorAll('.difficulty-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        this.gameState.difficulty = card.dataset.difficulty;
                        SoundEngine.cardSelect();
                    });
                });

                const nameInput = document.getElementById('playerName');
                nameInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' || e.key === 'Delete') {
                        SoundEngine.typeDelete();
                    } else if (e.key.length === 1) {
                        SoundEngine.typeKey();
                    }
                });
            }

            setupUI() {
                document.getElementById('startBtn').addEventListener('click', () => this.startGame());
                document.getElementById('playAgainWin').addEventListener('click', () => this.startGame());
                document.getElementById('playAgainLose').addEventListener('click', () => this.startGame());
                document.getElementById('chooseDifficultyWin').addEventListener('click', () => this.showStartScreen());
                document.getElementById('chooseDifficultyLose').addEventListener('click', () => this.showStartScreen());
            }

            startGame() {
                const name = document.getElementById('playerName').value.trim();
                if (!name) {
                    alert('Please enter your gardener name!');
                    return;
                }

                TitleMusic.stop();
                this.gameState.playerName = name;
                this.gameState.state = 'playing';
                this.gameState.reset();
                this.player = new Player(this.canvas, this.gameState.difficulty, {});
                this.fallingObjects = [];
                this.particles = [];
                this.popups = [];
                this.lumberjack = null;
                this.prevGrowthStage = 0;
                this.lastSpawn = Date.now();
                this.hideAllScreens();
            }

            showStartScreen() {
                this.gameState.state = 'start';
                this.hideAllScreens();
                document.getElementById('startScreen').classList.add('active');
                TitleMusic.start();
            }

            hideAllScreens() {
                document.querySelectorAll('.screen').forEach(screen => {
                    screen.classList.remove('active');
                });
            }

            // Returns live spawn parameters adjusted for current pressure level (Hard only)
            getPressureConfig() {
                const base = CONFIG[this.gameState.difficulty];
                const p = this.gameState.pressureLevel;
                if (this.gameState.difficulty !== 'hard' || p === 0) return base;

                // Each tier makes things harder: faster fall, more pests, tighter intervals
                const tiers = [
                    {},                                                        // 0: baseline
                    { fallMult: 1.35, pestBonus: 0.12, intervalMult: 0.78 }, // 1: danger 70%
                    { fallMult: 1.75, pestBonus: 0.22, intervalMult: 0.60 }, // 2: critical 85%
                    { fallMult: 2.20, pestBonus: 0.32, intervalMult: 0.45 }, // 3: final push 93%
                ];
                const tier = tiers[p];
                return {
                    ...base,
                    fallSpeed: base.fallSpeed * tier.fallMult,
                    pestChance: Math.min(base.pestChance + tier.pestBonus, 0.88),
                    spawnInterval: {
                        min: Math.round(base.spawnInterval.min * tier.intervalMult),
                        max: Math.round(base.spawnInterval.max * tier.intervalMult),
                    }
                };
            }

            spawnObject() {
                const config = this.getPressureConfig();
                const gs = this.gameState;
                const rand = Math.random();

                let type;
                if (gs.difficulty === 'medium' && rand < (config.wormChance || 0)) {
                    type = 'worm';
                } else if (rand < config.pestChance) {
                    type = 'pest';
                } else if (rand < config.pestChance + 0.05) {
                    type = 'shield';
                } else if (rand < config.pestChance + 0.25) {
                    type = 'water';
                } else {
                    type = 'sun';
                }

                const obj = new FallingObject(this.canvas, type, config.fallSpeed, gs.pressureLevel);
                this.fallingObjects.push(obj);
            }

            checkCollision(a, b) {
                return a.x < b.x + b.width &&
                    a.x + a.width > b.x &&
                    a.y < b.y + b.height &&
                    a.y + a.height > b.y;
            }

            createParticles(x, y, color, count = 10) {
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(x, y, color));
                }
            }

            createPopup(text, x, y, color) {
                this.popups.push(new PopupNotification(text, x, y, color));
            }

            activateBeeBoost() {
                this.gameState.beeActive = false;
                this.gameState.sunMultiplier = 2;
                this.gameState.sunMultiplierTimer = 600; // 10s at 60fps
                this.gameState.beeTimer = 900 + Math.random() * 900; // next bee in 15-30s
                SoundEngine.beeClick();
                this.createParticles(this.gameState.beeX, this.gameState.beeY, '#FFD700', 20);
                this.createPopup('🐝 2x SUN BOOST! 10s ☀️', this.canvas.width / 2, 130, '#FFD700');
            }

            update() {
                if (this.gameState.state !== 'playing') return;

                const gs = this.gameState;
                const config = CONFIG[gs.difficulty];
                const now = Date.now();

                this.player.update(this.canvas);
                gs.updateShield();

                // ── Day/Night cycle (Easy+) ──
                if (config.hasDayNight) {
                    gs.timeOfDay = (gs.timeOfDay + 0.0003) % 1;
                }

                // ── Growth stage fanfare (Easy+) ──
                if (config.hasGrowthFanfare) {
                    const stage = this.player.getGrowthStage(gs.growth);
                    if (stage > this.prevGrowthStage) {
                        this.prevGrowthStage = stage;
                        SoundEngine.growthFanfare(stage);
                        const msgs = ['🌱 SPROUTING!', '🌿 GROWING!', '🍃 LEAFING!', '🌿🌿 BRANCHING!', '🌸 BUDDING!', '🌺 BLOOMED!'];
                        this.createPopup(msgs[stage] || '🌸 GROWING!', this.canvas.width / 2, 120, '#4CAF50');
                        this.createParticles(this.player.x + this.player.width / 2, this.player.y, '#4CAF50', 30);
                    }
                }

                // ── Sun multiplier countdown (Medium+) ──
                if (gs.sunMultiplierTimer > 0) {
                    gs.sunMultiplierTimer--;
                    if (gs.sunMultiplierTimer <= 0) {
                        gs.sunMultiplier = 1;
                    }
                }

                // ── Bee system (Medium+) ──
                if (config.hasBee) {
                    if (!gs.beeActive) {
                        gs.beeTimer--;
                        if (gs.beeTimer <= 0) {
                            gs.beeActive = true;
                            gs.beeX = 30 + Math.random() * (this.canvas.width - 60);
                            gs.beeY = 100 + Math.random() * 200;
                            gs.beeDX = (Math.random() - 0.5) * 3;
                            gs.beeDY = (Math.random() - 0.5) * 2;
                            SoundEngine.beeAppear();
                        }
                    } else {
                        // Bee wanders
                        gs.beeX += gs.beeDX;
                        gs.beeY += gs.beeDY;
                        gs.beeDX += (Math.random() - 0.5) * 0.4;
                        gs.beeDY += (Math.random() - 0.5) * 0.3;
                        gs.beeDX = Math.max(-4, Math.min(4, gs.beeDX));
                        gs.beeDY = Math.max(-3, Math.min(3, gs.beeDY));
                        if (gs.beeX < 20) gs.beeDX += 0.5;
                        if (gs.beeX > this.canvas.width - 20) gs.beeDX -= 0.5;
                        if (gs.beeY < 80) gs.beeDY += 0.5;
                        if (gs.beeY > this.canvas.height - 120) gs.beeDY -= 0.5;

                        // Auto-disappear after 8s if not clicked
                        gs.beeTimer = gs.beeTimer || 0;
                        gs.beeAutoTimer = (gs.beeAutoTimer || 0) + 1;
                        if (gs.beeAutoTimer > 480) {
                            gs.beeActive = false;
                            gs.beeAutoTimer = 0;
                            gs.beeTimer = 600 + Math.random() * 600;
                        }
                    }
                }

                // ── Acid Rain system (Hard) ──
                if (config.hasAcidRain) {
                    if (gs.acidRainState === 'idle') {
                        gs.acidRainTimer--;
                        if (gs.acidRainTimer <= 0) {
                            gs.acidRainState = 'warning';
                            gs.acidRainWarningTimer = 180; // 3s warning
                            SoundEngine.acidRainWarning();
                        }
                    } else if (gs.acidRainState === 'warning') {
                        gs.acidRainWarningTimer--;
                        if (gs.acidRainWarningTimer % 90 === 0 && gs.acidRainWarningTimer > 0) {
                            SoundEngine.acidRainWarning();
                        }
                        if (gs.acidRainWarningTimer <= 0) {
                            gs.acidRainState = 'raining';
                            gs.acidRainTimer = 600 + Math.random() * 300; // rains 10-15s
                        }
                    } else if (gs.acidRainState === 'raining') {
                        // Drain growth slowly unless shielded
                        gs.acidDrainTimer++;
                        if (gs.acidDrainTimer % 60 === 0 && !gs.shieldActive) {
                            gs.growth = Math.max(0, gs.growth - 50);
                            SoundEngine.acidTick();
                            this.createPopup('☠️ ACID RAIN! -50', this.canvas.width / 2, 200, '#8BC34A');
                        }
                        gs.acidRainTimer--;
                        if (gs.acidRainTimer <= 0) {
                            gs.acidRainState = 'idle';
                            gs.acidRainTimer = 1500 + Math.random() * 1000; // rest 25-42s
                            gs.acidDrainTimer = 0;
                            this.createPopup('☀️ RAIN STOPPED!', this.canvas.width / 2, 200, '#4CAF50');
                        }
                    }
                }

                // ── Lumberjack system (Hard) ──
                if (config.hasLumberjack) {
                    if (!this.lumberjack) {
                        gs.lumberjackCooldown--;
                        if (gs.lumberjackCooldown <= 0) {
                            this.lumberjack = new Lumberjack(this.canvas);
                            SoundEngine.lumberjackAppear();
                            this.createPopup('⚠️ LUMBERJACK! CLICK HIM!', this.canvas.width / 2, 160, '#F44336');
                        }
                    } else {
                        this.lumberjack.update();

                        if (this.lumberjack.isChopped()) {
                            // He chops the plant — massive penalty
                            SoundEngine.lumberjackChop();
                            gs.growth = Math.floor(gs.growth * 0.3); // cut to 30%
                            this.prevGrowthStage = this.player.getGrowthStage(gs.growth);
                            gs.shake = 20;
                            this.createParticles(this.player.x + 40, this.player.y + 60, '#795548', 40);
                            this.createPopup('🪓 PLANT CHOPPED! -70% GROWTH!', this.canvas.width / 2, 200, '#F44336');
                            this.lumberjack = null;
                            gs.lumberjackCooldown = 1800 + Math.random() * 900; // long cooldown after chop
                        } else if (this.lumberjack.isGone()) {
                            SoundEngine.lumberjackFlee();
                            this.lumberjack = null;
                            gs.lumberjackCooldown = 1200 + Math.random() * 600;
                            this.createPopup('💪 LUMBERJACK DRIVEN AWAY!', this.canvas.width / 2, 160, '#4CAF50');
                        }
                    }
                }

                // ── XP Bar (Hard) ──
                if (config.hasXPBar) {
                    // XP ticks up passively while playing
                    if (now % 3 === 0) gs.xp = Math.min(gs.xp + 1, gs.xpMax);
                    if (gs.xp >= gs.xpMax) {
                        gs.xp = 0;
                        gs.xpMax = Math.floor(gs.xpMax * 1.2); // each bar gets harder
                        gs.activateShield();
                        SoundEngine.xpFull();
                        this.createPopup('⭐ MASTER GARDENER! SHIELD!', this.canvas.width / 2, 160, '#FFD700');
                    }
                }

                // ── Pressure System (Hard only) ──
                if (gs.difficulty === 'hard') {
                    const growthPct = gs.growth / GAME_CONSTANTS.MAX_GROWTH;
                    let newPressure = 0;
                    if (growthPct >= 0.93) newPressure = 3;
                    else if (growthPct >= 0.85) newPressure = 2;
                    else if (growthPct >= 0.70) newPressure = 1;

                    if (newPressure > gs.pressureLevel) {
                        gs.pressureLevel = newPressure;
                        gs.pressureAlertTimer = 240; // show alert for 4 seconds

                        if (newPressure === 1) {
                            SoundEngine.pressureDanger();
                            this.createPopup('⚠️ THE GARDEN RESISTS!', this.canvas.width / 2, 180, '#FF9800');
                        } else if (newPressure === 2) {
                            SoundEngine.pressureCritical();
                            this.createPopup('🔴 CRITICAL! HARDER TO GROW!', this.canvas.width / 2, 180, '#F44336');
                        } else if (newPressure === 3) {
                            SoundEngine.pressureFinalPush();
                            this.createPopup('💀 FINAL PUSH! SURVIVE!', this.canvas.width / 2, 180, '#B71C1C');
                        }
                    }

                    if (gs.pressureAlertTimer > 0) gs.pressureAlertTimer--;
                }

                // ── Spawning ──
                if (now - this.lastSpawn > this.nextSpawnDelay) {
                    this.spawnObject();
                    this.lastSpawn = now;
                    const liveConfig = this.getPressureConfig();
                    this.nextSpawnDelay = Math.random() *
                        (liveConfig.spawnInterval.max - liveConfig.spawnInterval.min) +
                        liveConfig.spawnInterval.min;
                }

                // ── Collision detection ──
                const playerBounds = this.player.getBounds();
                this.fallingObjects = this.fallingObjects.filter(obj => {
                    obj.update(this.canvas);

                    if (obj.active && this.checkCollision(playerBounds, obj.getBounds())) {
                        if (obj.type === 'worm') {
                            const boost = 200;
                            gs.growth = Math.min(gs.growth + boost, GAME_CONSTANTS.MAX_GROWTH);
                            if (gs.growth >= GAME_CONSTANTS.MAX_GROWTH) gs.state = 'win';
                            SoundEngine.collectWorm();
                            this.createParticles(obj.x + obj.width / 2, obj.y + obj.height / 2, '#7CFC00', 25);
                            this.createPopup('WORM BOOST! +200 🐍✨', this.canvas.width / 2, 150, '#7CFC00');
                        } else if (obj.type === 'water') {
                            // Apply sun multiplier to water too for balance
                            const mult = gs.sunMultiplier;
                            gs.addGrowth(mult);
                            SoundEngine.collectWater();
                            this.createParticles(obj.x + obj.width / 2, obj.y + obj.height / 2, '#3498DB', 15);
                            if (gs.combo >= 3) {
                                let comboText = `COMBO x${gs.combo}`;
                                let comboColor = '#FFD700';
                                if (gs.combo >= 10) { comboText = `MEGA COMBO x${gs.combo}! 🔥`; comboColor = '#FF4500'; }
                                else if (gs.combo >= 5) { comboText = `SUPER COMBO x${gs.combo}! ⚡`; comboColor = '#FF8C00'; }
                                SoundEngine.combo(gs.combo);
                                this.createPopup(comboText, this.canvas.width / 2, 150, comboColor);
                            }
                        } else if (obj.type === 'sun') {
                            const mult = gs.sunMultiplier;
                            gs.addGrowth(mult);
                            SoundEngine.collectSun();
                            this.createParticles(obj.x + obj.width / 2, obj.y + obj.height / 2, '#F39C12', 15);
                            if (mult > 1) this.createPopup(`☀️ x${mult} SUN!`, obj.x + 10, obj.y, '#FFD700');
                            if (gs.combo >= 3) {
                                let comboText = `COMBO x${gs.combo}`;
                                let comboColor = '#FFD700';
                                if (gs.combo >= 10) { comboText = `MEGA COMBO x${gs.combo}! 🔥`; comboColor = '#FF4500'; }
                                else if (gs.combo >= 5) { comboText = `SUPER COMBO x${gs.combo}! ⚡`; comboColor = '#FF8C00'; }
                                SoundEngine.combo(gs.combo);
                                this.createPopup(comboText, this.canvas.width / 2, 150, comboColor);
                            }
                        } else if (obj.type === 'shield') {
                            gs.activateShield();
                            SoundEngine.collectShield();
                            this.createParticles(obj.x + obj.width / 2, obj.y + obj.height / 2, '#9B59B6', 20);
                            this.createPopup('SHIELD ACTIVE! 🛡️', this.canvas.width / 2, 150, '#9B59B6');
                        } else {
                            const wasShielded = gs.shieldActive;
                            gs.loseHeart();
                            this.createParticles(obj.x + obj.width / 2, obj.y + obj.height / 2, '#E74C3C', 20);
                            if (wasShielded) {
                                SoundEngine.shieldBlocked();
                                this.createPopup('SHIELD BLOCKED! 💥', this.canvas.width / 2, 150, '#9B59B6');
                            } else {
                                SoundEngine.pestHit();
                                this.createPopup('COMBO LOST! 💔', this.canvas.width / 2, 150, '#E74C3C');
                            }
                        }
                        obj.active = false;
                    }
                    return obj.active;
                });

                this.particles = this.particles.filter(p => { p.update(); return p.isAlive(); });
                this.popups = this.popups.filter(p => { p.update(); return p.isAlive(); });

                if (gs.shake > 0) gs.shake--;

                if (gs.state === 'win') this.showWinScreen();
                else if (gs.state === 'lose') this.showLoseScreen();
            }

            draw() {
                const gs = this.gameState;
                const config = CONFIG[gs.difficulty];

                // ── Day/Night sky background ──
                if (config.hasDayNight) {
                    const t = gs.timeOfDay;
                    // Cycle: 0=day(0.3), 0.3=dusk(0.5), 0.5=night(0.8), 0.8=dawn(1.0)
                    let skyTop, skyBot;
                    if (t < 0.3) {
                        skyTop = '#87CEEB'; skyBot = '#E8F5E9';
                    } else if (t < 0.5) {
                        const p = (t - 0.3) / 0.2;
                        skyTop = lerpColor('#87CEEB', '#FF6B35', p);
                        skyBot = lerpColor('#E8F5E9', '#FFB347', p);
                    } else if (t < 0.8) {
                        const p = (t - 0.5) / 0.3;
                        skyTop = lerpColor('#FF6B35', '#0D1B2A', p);
                        skyBot = lerpColor('#FFB347', '#1a3a5c', p);
                    } else {
                        const p = (t - 0.8) / 0.2;
                        skyTop = lerpColor('#0D1B2A', '#87CEEB', p);
                        skyBot = lerpColor('#1a3a5c', '#E8F5E9', p);
                    }
                    const grad = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                    grad.addColorStop(0, skyTop);
                    grad.addColorStop(1, skyBot);
                    this.ctx.fillStyle = grad;
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                    // Stars at night
                    if (t > 0.5 && t < 0.85) {
                        const starAlpha = t < 0.65 ? (t - 0.5) / 0.15 : t > 0.75 ? 1 - (t - 0.75) / 0.1 : 1;
                        this.ctx.fillStyle = `rgba(255,255,255,${starAlpha * 0.8})`;
                        // Deterministic stars
                        for (let i = 0; i < 30; i++) {
                            const sx = ((i * 137 + 50) % this.canvas.width);
                            const sy = ((i * 97 + 30) % (this.canvas.height * 0.5));
                            const ss = (i % 3 === 0) ? 2.5 : 1.5;
                            this.ctx.fillRect(sx, sy, ss, ss);
                        }
                    }
                } else {
                    this.ctx.fillStyle = '#87CEEB';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                }

                if (gs.state !== 'playing' || !this.player) return;

                if (gs.shake > 0) {
                    this.ctx.save();
                    this.ctx.translate(
                        (Math.random() - 0.5) * gs.shake,
                        (Math.random() - 0.5) * gs.shake
                    );
                }

                this.fallingObjects.forEach(obj => obj.draw(this.ctx));
                this.particles.forEach(p => p.draw(this.ctx));

                // ── Acid rain overlay ──
                if (config.hasAcidRain && gs.acidRainState === 'raining') {
                    const t = Date.now();
                    this.ctx.save();
                    this.ctx.globalAlpha = 0.18;
                    this.ctx.fillStyle = '#76FF03';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.globalAlpha = 1;
                    // Animated rain streaks
                    this.ctx.strokeStyle = 'rgba(100, 200, 50, 0.5)';
                    this.ctx.lineWidth = 1.5;
                    for (let i = 0; i < 25; i++) {
                        const rx = ((i * 73 + (t / 8)) % this.canvas.width);
                        const ry = ((i * 53 + (t / 5)) % this.canvas.height);
                        this.ctx.beginPath();
                        this.ctx.moveTo(rx, ry);
                        this.ctx.lineTo(rx - 3, ry + 18);
                        this.ctx.stroke();
                    }
                    this.ctx.restore();
                }

                // ── Acid rain WARNING flash ──
                if (config.hasAcidRain && gs.acidRainState === 'warning') {
                    const flash = Math.floor(Date.now() / 300) % 2 === 0;
                    if (flash) {
                        const wx = this.canvas.width - 155;
                        const wy = 80;
                        this.ctx.fillStyle = 'rgba(200,0,0,0.92)';
                        this.ctx.fillRect(wx, wy, 145, 52);
                        this.ctx.strokeStyle = '#fff';
                        this.ctx.lineWidth = 3;
                        this.ctx.strokeRect(wx, wy, 145, 52);
                        this.ctx.fillStyle = '#fff';
                        this.ctx.font = 'bold 9px "Press Start 2P"';
                        this.ctx.textAlign = 'center';
                        this.ctx.fillText('⚠️ ACID RAIN', wx + 72, wy + 20);
                        const secs = Math.ceil(gs.acidRainWarningTimer / 60);
                        this.ctx.fillText(`IN ${secs}s!`, wx + 72, wy + 38);
                    }
                }

                // Shield aura
                if (gs.shieldActive) {
                    const pulse = Math.sin(Date.now() / 100) * 5 + 10;
                    this.ctx.strokeStyle = 'rgba(155, 89, 182, 0.6)';
                    this.ctx.lineWidth = 5;
                    this.ctx.beginPath();
                    this.ctx.arc(this.player.x + this.player.width / 2, this.player.y + this.player.height / 2, 50 + pulse, 0, Math.PI * 2);
                    this.ctx.stroke();
                    this.ctx.strokeStyle = 'rgba(155, 89, 182, 0.3)';
                    this.ctx.lineWidth = 3;
                    this.ctx.beginPath();
                    this.ctx.arc(this.player.x + this.player.width / 2, this.player.y + this.player.height / 2, 60 + pulse, 0, Math.PI * 2);
                    this.ctx.stroke();
                }

                this.player.draw(this.ctx, gs.growth);

                // ── Draw Lumberjack ──
                if (this.lumberjack) this.lumberjack.draw(this.ctx);

                // ── Draw Bee ──
                if (config.hasBee && gs.beeActive) {
                    this.drawBee(this.ctx, gs.beeX, gs.beeY);
                }

                this.popups.forEach(p => p.draw(this.ctx));

                // ── Pressure vignette overlay (Hard) ──
                if (gs.difficulty === 'hard' && gs.pressureLevel > 0) {
                    const intensity = [0, 0.18, 0.32, 0.48][gs.pressureLevel];
                    const colors = ['', 'rgba(255,100,0,', 'rgba(220,0,0,', 'rgba(150,0,0,'];
                    const grad = this.ctx.createRadialGradient(
                        this.canvas.width / 2, this.canvas.height / 2, this.canvas.height * 0.25,
                        this.canvas.width / 2, this.canvas.height / 2, this.canvas.height * 0.75
                    );
                    const pulse = Math.abs(Math.sin(Date.now() / (gs.pressureLevel === 3 ? 300 : 600))) * 0.4;
                    grad.addColorStop(0, 'rgba(0,0,0,0)');
                    grad.addColorStop(1, `${colors[gs.pressureLevel]}${(intensity + pulse * 0.15).toFixed(2)})`);
                    this.ctx.fillStyle = grad;
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                }

                if (gs.shake > 0) this.ctx.restore();

                this.drawHUD();
            }

            drawBee(ctx, x, y) {
                const t = Date.now() / 80;
                const bob = Math.sin(t) * 3;
                ctx.save();
                ctx.translate(x, y + bob);

                // Glow
                ctx.shadowColor = '#FFD700';
                ctx.shadowBlur = 12;

                // Body
                ctx.fillStyle = '#FDD835';
                ctx.beginPath();
                ctx.ellipse(0, 0, 12, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Stripes
                ctx.fillStyle = '#212121';
                [-4, 0, 4].forEach(sx => {
                    ctx.fillRect(sx - 1, -8, 3, 16);
                });
                ctx.beginPath();
                ctx.ellipse(0, 0, 12, 8, 0, 0, Math.PI * 2);
                ctx.clip();
                [-4, 0, 4].forEach(sx => {
                    ctx.fillRect(sx - 1, -8, 3, 16);
                });

                ctx.restore();
                ctx.save();
                ctx.translate(x, y + bob);
                ctx.shadowBlur = 0;

                // Wings (flapping)
                const wingFlap = Math.sin(Date.now() / 40) * 0.4;
                ctx.fillStyle = 'rgba(200, 230, 255, 0.7)';
                ctx.beginPath();
                ctx.ellipse(-8, -10 + wingFlap * 3, 9, 5, wingFlap, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(8, -10 + wingFlap * 3, 9, 5, -wingFlap, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(-4, -3, 2.5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(4, -3, 2.5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(-4, -3, 1.2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(4, -3, 1.2, 0, Math.PI * 2); ctx.fill();

                // Click prompt
                const pulseScale = 0.85 + Math.abs(Math.sin(Date.now() / 300)) * 0.3;
                ctx.font = `bold ${Math.round(9 * pulseScale)}px "Press Start 2P"`;
                ctx.fillStyle = '#FFD700';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.textAlign = 'center';
                ctx.strokeText('CLICK!', 0, -22);
                ctx.fillText('CLICK!', 0, -22);

                ctx.restore();
            }

            drawHUD() {
                const padding = 15;
                const barWidth = 200;
                const barHeight = 30;
                const barY = 20;

                // === GROWTH BAR (LEFT) ===
                // Background panel
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                this.ctx.fillRect(padding, barY, barWidth + 30, barHeight + 40);
                this.ctx.strokeStyle = '#000';
                this.ctx.lineWidth = 4;
                this.ctx.strokeRect(padding, barY, barWidth + 30, barHeight + 40);

                // Label
                this.ctx.fillStyle = '#000';
                this.ctx.font = '10px "Press Start 2P"';
                this.ctx.textAlign = 'left';
                this.ctx.fillText('GROWTH', padding + 10, barY + 18);

                // Score
                this.ctx.textAlign = 'right';
                this.ctx.fillText(`${this.gameState.growth} / ${GAME_CONSTANTS.MAX_GROWTH}`, padding + barWidth + 20, barY + 18);

                // Progress bar background
                this.ctx.fillStyle = '#fff';
                this.ctx.fillRect(padding + 10, barY + 25, barWidth, barHeight - 5);
                this.ctx.strokeStyle = '#000';
                this.ctx.lineWidth = 3;
                this.ctx.strokeRect(padding + 10, barY + 25, barWidth, barHeight - 5);

                // Progress bar fill
                const growthPercent = this.gameState.getGrowthPercent();
                const growthFillWidth = (barWidth - 4) * (growthPercent / 100);
                this.ctx.fillStyle = '#4CAF50';
                this.ctx.fillRect(padding + 12, barY + 27, growthFillWidth, barHeight - 9);

                // === HEALTH BAR (RIGHT) ===
                const rightX = this.canvas.width - barWidth - padding - 30;

                // Background panel
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                this.ctx.fillRect(rightX, barY, barWidth + 30, barHeight + 40);
                this.ctx.strokeStyle = '#000';
                this.ctx.lineWidth = 4;
                this.ctx.strokeRect(rightX, barY, barWidth + 30, barHeight + 40);

                // Label
                this.ctx.fillStyle = '#000';
                this.ctx.font = '10px "Press Start 2P"';
                this.ctx.textAlign = 'left';
                this.ctx.fillText('HEALTH', rightX + 10, barY + 18);

                // Heart and percentage
                this.ctx.textAlign = 'right';
                const healthPercent = Math.round(this.gameState.getHealthPercent());
                this.ctx.fillText(`❤️ ${healthPercent}%`, rightX + barWidth + 20, barY + 18);

                // Progress bar background
                this.ctx.fillStyle = '#fff';
                this.ctx.fillRect(rightX + 10, barY + 25, barWidth, barHeight - 5);
                this.ctx.strokeStyle = '#000';
                this.ctx.lineWidth = 3;
                this.ctx.strokeRect(rightX + 10, barY + 25, barWidth, barHeight - 5);

                // Progress bar fill
                const healthFillWidth = (barWidth - 4) * (healthPercent / 100);
                this.ctx.fillStyle = '#E74C3C';
                this.ctx.fillRect(rightX + 12, barY + 27, healthFillWidth, barHeight - 9);

                // === SHIELD INDICATOR (BOTTOM CENTER) ===
                if (this.gameState.shieldActive) {
                    const shieldX = this.canvas.width / 2;
                    const shieldY = this.canvas.height - 40;
                    this.ctx.fillStyle = 'rgba(155, 89, 182, 0.9)';
                    this.ctx.fillRect(shieldX - 70, shieldY, 140, 30);
                    this.ctx.strokeStyle = '#000';
                    this.ctx.lineWidth = 3;
                    this.ctx.strokeRect(shieldX - 70, shieldY, 140, 30);
                    this.ctx.fillStyle = '#FFF';
                    this.ctx.font = '12px "Press Start 2P"';
                    this.ctx.textAlign = 'center';
                    const timeLeft = Math.ceil(this.gameState.shieldDuration / 60);
                    this.ctx.fillText(`🛡️ SHIELD ${timeLeft}s`, shieldX, shieldY + 20);
                }

                // === SUN MULTIPLIER INDICATOR ===
                if (this.gameState.sunMultiplier > 1 && this.gameState.sunMultiplierTimer > 0) {
                    const mx = this.canvas.width / 2;
                    const my = this.canvas.height - 75;
                    const secs = Math.ceil(this.gameState.sunMultiplierTimer / 60);
                    this.ctx.fillStyle = 'rgba(255, 200, 0, 0.92)';
                    this.ctx.fillRect(mx - 80, my, 160, 28);
                    this.ctx.strokeStyle = '#000';
                    this.ctx.lineWidth = 3;
                    this.ctx.strokeRect(mx - 80, my, 160, 28);
                    this.ctx.fillStyle = '#000';
                    this.ctx.font = '10px "Press Start 2P"';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(`🐝 2x SUN  ${secs}s`, mx, my + 18);
                }

                // === XP BAR (Hard only) ===
                const config = CONFIG[this.gameState.difficulty];
                if (config.hasXPBar) {
                    const xpY = this.canvas.height - 18;
                    const xpW = this.canvas.width - 30;
                    const xpX = 15;

                    this.ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    this.ctx.fillRect(xpX, xpY, xpW, 12);
                    this.ctx.strokeStyle = '#FFD700';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(xpX, xpY, xpW, 12);

                    const xpFill = (this.gameState.xp / this.gameState.xpMax) * (xpW - 4);
                    const xpGrad = this.ctx.createLinearGradient(xpX, 0, xpX + xpW, 0);
                    xpGrad.addColorStop(0, '#FFD700');
                    xpGrad.addColorStop(1, '#FF8C00');
                    this.ctx.fillStyle = xpGrad;
                    this.ctx.fillRect(xpX + 2, xpY + 2, xpFill, 8);

                    this.ctx.fillStyle = '#FFD700';
                    this.ctx.font = '7px "Press Start 2P"';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(`⭐ MASTER GARDENER XP`, this.canvas.width / 2, xpY - 3);
                }

                // === ACID RAIN STATUS ===
                if (config.hasAcidRain && this.gameState.acidRainState === 'raining') {
                    const arX = this.canvas.width / 2;
                    const arY = 82;
                    const flash = Math.floor(Date.now() / 400) % 2 === 0;
                    this.ctx.fillStyle = flash ? 'rgba(100,200,0,0.9)' : 'rgba(60,150,0,0.9)';
                    this.ctx.fillRect(arX - 70, arY, 140, 24);
                    this.ctx.strokeStyle = '#fff';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(arX - 70, arY, 140, 24);
                    this.ctx.fillStyle = '#fff';
                    this.ctx.font = '8px "Press Start 2P"';
                    this.ctx.textAlign = 'center';
                    const remaining = Math.ceil(this.gameState.acidRainTimer / 60);
                    this.ctx.fillText(`☠️ ACID RAIN ${remaining}s`, arX, arY + 16);
                }

                // === PRESSURE INDICATOR (Hard) ===
                if (this.gameState.difficulty === 'hard' && this.gameState.pressureLevel > 0) {
                    const p = this.gameState.pressureLevel;
                    const labels = ['', '⚠️ DANGER', '🔴 CRITICAL', '💀 FINAL PUSH'];
                    const colors = ['', '#FF9800', '#F44336', '#B71C1C'];
                    const px = this.canvas.width / 2;
                    const py = this.gameState.acidRainState === 'raining' ? 112 : 82;

                    const flash = p >= 2 && Math.floor(Date.now() / (p === 3 ? 250 : 400)) % 2 === 0;
                    this.ctx.fillStyle = flash
                        ? 'rgba(255,255,255,0.95)'
                        : colors[p] + 'dd';
                    const w = p === 3 ? 160 : 140;
                    this.ctx.fillRect(px - w / 2, py, w, 24);
                    this.ctx.strokeStyle = flash ? colors[p] : '#fff';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(px - w / 2, py, w, 24);

                    this.ctx.fillStyle = flash ? colors[p] : '#fff';
                    this.ctx.font = `bold 8px "Press Start 2P"`;
                    this.ctx.textAlign = 'center';
                    const pct = Math.round(this.gameState.growth / GAME_CONSTANTS.MAX_GROWTH * 100);
                    this.ctx.fillText(`${labels[p]}  ${pct}%`, px, py + 16);

                    // Alert banner on tier change
                    if (this.gameState.pressureAlertTimer > 0) {
                        const alertAlpha = Math.min(1, this.gameState.pressureAlertTimer / 30);
                        const bannerMsgs = ['', 'GARDEN RESISTS!', 'ITEMS SHRINKING!', 'ALMOST IMPOSSIBLE!'];
                        this.ctx.globalAlpha = alertAlpha;
                        this.ctx.fillStyle = colors[p];
                        this.ctx.fillRect(0, this.canvas.height / 2 - 28, this.canvas.width, 50);
                        this.ctx.fillStyle = '#fff';
                        this.ctx.font = 'bold 14px "Press Start 2P"';
                        this.ctx.fillText(bannerMsgs[p], px, this.canvas.height / 2 + 6);
                        this.ctx.globalAlpha = 1;
                    }
                }
            }

            showWinScreen() {
                this.hideAllScreens();
                SoundEngine.win();
                const winStats = document.getElementById('winStats');
                winStats.textContent = `Max Combo: x${this.gameState.maxCombo} | Final Score: ${this.gameState.growth}`;
                document.getElementById('winScreen').classList.add('active');

                // Save score to Firebase Hall of Bloom
                if (typeof window.saveScoreToFirebase === 'function') {
                    window.saveScoreToFirebase({
                        name: this.gameState.playerName || 'GARDENER',
                        score: this.gameState.growth,
                        maxCombo: this.gameState.maxCombo,
                        difficulty: this.gameState.difficulty,
                        timestamp: Date.now()
                    }).catch(err => console.warn('Leaderboard save failed:', err));
                }
            }

            showLoseScreen() {
                this.hideAllScreens();
                SoundEngine.lose();
                document.getElementById('loseScreen').classList.add('active');
            }

            animate() {
                this.update();
                this.draw();
                requestAnimationFrame(this.animate);
            }
        }

        // ===== HALL OF BLOOM RENDERER =====
        const RANK_MEDALS = ['🏅', '🥈', '🥉'];
        const BADGE_CLASS = { easy: 'badge-easy', medium: 'badge-medium', hard: 'badge-hard' };
        const DIFF_LABEL = { easy: 'EASY', medium: 'MED', hard: 'HARD' };

        function renderLeaderboard(entries) {
            const container = document.getElementById('leaderboardEntries');
            if (!container) return;

            if (!entries || entries.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:12px;font-size:8px;color:#7a9a5a;">No scores yet — be first! 🌱</div>';
                return;
            }

            container.innerHTML = entries.map((e, i) => {
                const medal = RANK_MEDALS[i] || `#${i + 1}`;
                const badgeClass = BADGE_CLASS[e.difficulty] || 'badge-easy';
                const diffLabel = DIFF_LABEL[e.difficulty] || e.difficulty.toUpperCase();
                const nameDisplay = (e.name || 'GARDENER').toUpperCase().substring(0, 12);
                return `
                <div class="leaderboard-entry">
                    <div class="name">
                        <span>${medal}</span>
                        <span>${nameDisplay}</span>
                    </div>
                    <div>
                        <span class="difficulty-badge ${badgeClass}">${diffLabel}</span>
                        <span class="score">${e.score}</span>
                    </div>
                </div>`;
            }).join('');
        }

        window.addEventListener('load', () => {
            new Game();

            // Start title music on first user interaction (browser autoplay policy)
            const startMusicOnce = () => {
                TitleMusic.start();
                document.removeEventListener('click', startMusicOnce);
                document.removeEventListener('keydown', startMusicOnce);
                document.removeEventListener('touchstart', startMusicOnce);
            };
            document.addEventListener('click', startMusicOnce);
            document.addEventListener('keydown', startMusicOnce);
            document.addEventListener('touchstart', startMusicOnce);

            // Subscribe to live leaderboard updates
            if (typeof window.subscribeLeaderboard === 'function') {
                window.subscribeLeaderboard(renderLeaderboard);
            }
        });
    </script>
</body>

</html>
