<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Growth Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getDatabase, ref, push, query, orderByChild, limitToLast, onValue } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

        // =====================================================
        // 🔑 YOUR FIREBASE CONFIG — Replace with YOUR values!
        // Get these from: Firebase Console → Project Settings → Your apps → Web app
        // =====================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Save a score entry to Firebase
        window.saveScoreToFirebase = function (entry) {
            return push(ref(db, 'leaderboard'), entry);
        };

        // Listen to the top 10 scores in real-time
        window.subscribeLeaderboard = function (callback) {
            const q = query(
                ref(db, 'leaderboard'),
                orderByChild('score'),
                limitToLast(10)
            );
            onValue(q, (snapshot) => {
                const entries = [];
                snapshot.forEach(child => {
                    entries.push({ id: child.key, ...child.val() });
                });
                // Sort descending (Firebase limitToLast gives ascending)
                entries.sort((a, b) => b.score - a.score);
                callback(entries);
            });
        };
    </script>
    <script>
        // ===== SOUND ENGINE (Web Audio API) =====
        const SoundEngine = (() => {
            let ctx = null;
            let enabled = true;

            function getCtx() {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                return ctx;
            }

            function playTone({ frequency = 440, type = 'sine', duration = 0.15, volume = 0.3, attack = 0.01, decay = 0.05, sustain = 0.6, release = 0.1, detune = 0, delay = 0 }) {
                if (!enabled) return;
                try {
                    const ac = getCtx();
                    const osc = ac.createOscillator();
                    const gain = ac.createGain();
                    osc.connect(gain);
                    gain.connect(ac.destination);
                    osc.type = type;
                    osc.frequency.setValueAtTime(frequency, ac.currentTime + delay);
                    osc.detune.setValueAtTime(detune, ac.currentTime + delay);
                    gain.gain.setValueAtTime(0, ac.currentTime + delay);
                    gain.gain.linearRampToValueAtTime(volume, ac.currentTime + delay + attack);
                    gain.gain.linearRampToValueAtTime(volume * sustain, ac.currentTime + delay + attack + decay);
                    gain.gain.linearRampToValueAtTime(0, ac.currentTime + delay + duration + release);
                    osc.start(ac.currentTime + delay);
                    osc.stop(ac.currentTime + delay + duration + release + 0.05);
                } catch (e) { }
            }

            function playNoise({ duration = 0.1, volume = 0.2, lowpass = 800, delay = 0 }) {
                if (!enabled) return;
                try {
                    const ac = getCtx();
                    const bufferSize = ac.sampleRate * duration;
                    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const source = ac.createBufferSource();
                    source.buffer = buffer;
                    const filter = ac.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = lowpass;
                    const gain = ac.createGain();
                    gain.gain.setValueAtTime(volume, ac.currentTime + delay);
                    gain.gain.linearRampToValueAtTime(0, ac.currentTime + delay + duration);
                    source.connect(filter);
                    filter.connect(gain);
                    gain.connect(ac.destination);
                    source.start(ac.currentTime + delay);
                    source.stop(ac.currentTime + delay + duration + 0.05);
                } catch (e) { }
            }

            return {
                toggle() { enabled = !enabled; return enabled; },
                isEnabled() { return enabled; },

                // Difficulty card select — satisfying pop + rising confirm chord
                cardSelect() {
                    playTone({ frequency: 380, type: 'square', duration: 0.04, volume: 0.18, attack: 0.005, release: 0.04 });
                    playTone({ frequency: 600, type: 'triangle', duration: 0.08, volume: 0.15, attack: 0.005, release: 0.06, delay: 0.03 });
                    playTone({ frequency: 900, type: 'triangle', duration: 0.10, volume: 0.10, attack: 0.005, release: 0.08, delay: 0.06 });
                },

                // Keyboard typing — soft mechanical tap with randomised pitch
                typeKey() {
                    const pitches = [520, 560, 500, 580, 540];
                    const f = pitches[Math.floor(Math.random() * pitches.length)];
                    playTone({ frequency: f, type: 'square', duration: 0.025, volume: 0.10, attack: 0.003, decay: 0.01, sustain: 0.3, release: 0.02 });
                    playNoise({ duration: 0.018, volume: 0.06, lowpass: 3000 });
                },

                // Backspace / delete — lower dull thud
                typeDelete() {
                    playTone({ frequency: 280, type: 'square', duration: 0.03, volume: 0.10, attack: 0.003, release: 0.025 });
                    playNoise({ duration: 0.02, volume: 0.05, lowpass: 1200 });
                },

                // Worm collect - magical power-up fanfare
                collectWorm() {
                    // Rising arpeggio with a triumphant punch
                    [261, 329, 392, 523, 659, 784].forEach((f, i) => {
                        playTone({ frequency: f, type: 'triangle', duration: 0.14, volume: 0.28, delay: i * 0.055 });
                    });
                    // Sparkle overtone on top
                    playTone({ frequency: 1047, type: 'sine', duration: 0.3, volume: 0.18, delay: 0.3 });
                },

                // Collect water - bubbly rising notes
                collectWater() {
                    playTone({ frequency: 440, type: 'sine', duration: 0.1, volume: 0.25 });
                    playTone({ frequency: 550, type: 'sine', duration: 0.1, volume: 0.2, delay: 0.05 });
                    playTone({ frequency: 660, type: 'sine', duration: 0.15, volume: 0.2, delay: 0.1 });
                },

                // Collect sun - bright cheerful chord
                collectSun() {
                    playTone({ frequency: 523, type: 'triangle', duration: 0.12, volume: 0.25 });
                    playTone({ frequency: 659, type: 'triangle', duration: 0.12, volume: 0.2, delay: 0.04 });
                    playTone({ frequency: 784, type: 'triangle', duration: 0.18, volume: 0.2, delay: 0.08 });
                },

                // Combo - escalating hits
                combo(level) {
                    const base = 300 + level * 60;
                    playTone({ frequency: base, type: 'square', duration: 0.08, volume: 0.2 });
                    playTone({ frequency: base * 1.5, type: 'square', duration: 0.1, volume: 0.25, delay: 0.07 });
                    if (level >= 5) {
                        playTone({ frequency: base * 2, type: 'sawtooth', duration: 0.15, volume: 0.2, delay: 0.14 });
                    }
                },

                // Shield collect - magical shimmer
                collectShield() {
                    [400, 500, 600, 700, 800].forEach((f, i) => {
                        playTone({ frequency: f, type: 'sine', duration: 0.2, volume: 0.15, delay: i * 0.04 });
                    });
                },

                // Pest hit - thud + buzz
                pestHit() {
                    playNoise({ duration: 0.15, volume: 0.3, lowpass: 400 });
                    playTone({ frequency: 150, type: 'sawtooth', duration: 0.2, volume: 0.3 });
                },

                // Shield blocked - clash
                shieldBlocked() {
                    playTone({ frequency: 300, type: 'square', duration: 0.05, volume: 0.3 });
                    playTone({ frequency: 250, type: 'square', duration: 0.1, volume: 0.25, delay: 0.05 });
                    playNoise({ duration: 0.1, volume: 0.15, lowpass: 600, delay: 0.03 });
                },

                // Win fanfare
                win() {
                    const notes = [
                        { f: 523, d: 0 }, { f: 659, d: 0.12 }, { f: 784, d: 0.24 },
                        { f: 1047, d: 0.36 }, { f: 784, d: 0.52 }, { f: 1047, d: 0.64 }
                    ];
                    notes.forEach(({ f, d }) => {
                        playTone({ frequency: f, type: 'triangle', duration: 0.18, volume: 0.3, delay: d });
                    });
                },

                // Lose jingle
                lose() {
                    const notes = [
                        { f: 494, d: 0 }, { f: 440, d: 0.18 }, { f: 392, d: 0.36 }, { f: 330, d: 0.54 }
                    ];
                    notes.forEach(({ f, d }) => {
                        playTone({ frequency: f, type: 'sawtooth', duration: 0.2, volume: 0.25, delay: d });
                    });
                },

                // Growth stage fanfare — ascending sparkle burst
                growthFanfare(stage) {
                    const baseFreq = 400 + stage * 80;
                    [0, 0.08, 0.16, 0.26].forEach((d, i) => {
                        playTone({ frequency: baseFreq * (1 + i * 0.25), type: 'triangle', duration: 0.18, volume: 0.22, delay: d });
                    });
                    playTone({ frequency: baseFreq * 2, type: 'sine', duration: 0.35, volume: 0.15, delay: 0.3 });
                },

                // Bee appear — quick buzz
                beeAppear() {
                    playTone({ frequency: 320, type: 'sawtooth', duration: 0.06, volume: 0.12 });
                    playTone({ frequency: 480, type: 'sawtooth', duration: 0.06, volume: 0.1, delay: 0.04 });
                },

                // Bee click — sweet chime
                beeClick() {
                    [880, 1047, 1319].forEach((f, i) => {
                        playTone({ frequency: f, type: 'triangle', duration: 0.12, volume: 0.2, delay: i * 0.06 });
                    });
                },

                // Acid rain warning — ominous pulse
                acidRainWarning() {
                    playTone({ frequency: 220, type: 'sawtooth', duration: 0.3, volume: 0.25 });
                    playTone({ frequency: 180, type: 'sawtooth', duration: 0.3, volume: 0.2, delay: 0.35 });
                },

                // Acid rain drop tick
                acidTick() {
                    playTone({ frequency: 600, type: 'sine', duration: 0.04, volume: 0.08 });
                },

                // Lumberjack appears — dramatic stomp
                lumberjackAppear() {
                    playNoise({ duration: 0.12, volume: 0.35, lowpass: 300 });
                    playTone({ frequency: 80, type: 'sine', duration: 0.25, volume: 0.4 });
                    playTone({ frequency: 60, type: 'sine', duration: 0.25, volume: 0.3, delay: 0.1 });
                },

                // Lumberjack stun hit
                lumberjackHit() {
                    playNoise({ duration: 0.06, volume: 0.2, lowpass: 600 });
                    playTone({ frequency: 250, type: 'square', duration: 0.05, volume: 0.2 });
                },

                // Lumberjack chops plant — heavy axe thud
                lumberjackChop() {
                    playNoise({ duration: 0.2, volume: 0.5, lowpass: 250 });
                    playTone({ frequency: 60, type: 'sawtooth', duration: 0.3, volume: 0.45 });
                    playTone({ frequency: 40, type: 'sine', duration: 0.4, volume: 0.3, delay: 0.1 });
                },

                // Lumberjack driven away
                lumberjackFlee() {
                    [300, 250, 200, 150].forEach((f, i) => {
                        playTone({ frequency: f, type: 'square', duration: 0.07, volume: 0.15, delay: i * 0.06 });
                    });
                },

                // XP bar full — triumphant shield drop
                xpFull() {
                    [523, 659, 784, 1047].forEach((f, i) => {
                        playTone({ frequency: f, type: 'triangle', duration: 0.2, volume: 0.28, delay: i * 0.1 });
                    });
                    playTone({ frequency: 1568, type: 'sine', duration: 0.4, volume: 0.2, delay: 0.45 });
                },

                // Pressure tier 1 — ominous low drone
                pressureDanger() {
                    playTone({ frequency: 110, type: 'sawtooth', duration: 0.4, volume: 0.3 });
                    playTone({ frequency: 165, type: 'sawtooth', duration: 0.3, volume: 0.2, delay: 0.15 });
                    playNoise({ duration: 0.2, volume: 0.1, lowpass: 500, delay: 0.1 });
                },

                // Pressure tier 2 — urgent alarm
                pressureCritical() {
                    [330, 440, 330, 440].forEach((f, i) => {
                        playTone({ frequency: f, type: 'square', duration: 0.12, volume: 0.28, delay: i * 0.14 });
                    });
                    playNoise({ duration: 0.15, volume: 0.15, lowpass: 600, delay: 0.05 });
                },

                // Pressure tier 3 — maximum threat klaxon
                pressureFinalPush() {
                    [523, 392, 523, 392, 659].forEach((f, i) => {
                        playTone({ frequency: f, type: 'sawtooth', duration: 0.1, volume: 0.32, delay: i * 0.1 });
                    });
                    playNoise({ duration: 0.25, volume: 0.25, lowpass: 400 });
                }
            };
        })();
        window.SoundEngine = SoundEngine;

        // ===== TITLE MUSIC =====
        const TitleMusic = (() => {
            let musicCtx = null;
            let masterGain = null;
            let playing = false;
            let scheduledNodes = [];
            let loopTimeout = null;
            let startedAt = 0;

            // BPM = 132, quarter note = 60/132 s
            const BPM = 132;
            const Q = 60 / BPM;       // quarter note duration
            const E = Q / 2;          // eighth note
            const S = Q / 4;          // sixteenth note

            // Notes: frequency helpers
            const NOTE = {
                C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23,
                G4: 392.00, A4: 440.00, B4: 493.88,
                C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46,
                G5: 783.99, A5: 880.00, B5: 987.77, C6: 1046.50,
                C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61,
                G3: 196.00, A3: 220.00, B3: 246.94,
                G2: 98.00, C2: 65.41
            };

            // ── MELODY (16 bars, cheerful garden waltz feel) ──
            // Format: [freq, startBeat, durationBeats]
            // Beat 0 = bar 1 beat 1. Each bar = 4 beats.
            const MELODY = [
                // Bar 1-2: opening phrase
                [NOTE.E5, 0, E], [NOTE.G5, E, E], [NOTE.A5, Q, Q],
                [NOTE.G5, Q * 2, E], [NOTE.E5, Q * 2 + E, E], [NOTE.C5, Q * 3, Q],
                // Bar 3-4
                [NOTE.D5, Q * 4, E], [NOTE.F5, Q * 4 + E, E], [NOTE.G5, Q * 5, Q],
                [NOTE.F5, Q * 6, E], [NOTE.D5, Q * 6 + E, E], [NOTE.C5, Q * 7, Q + E],
                // Bar 5-6: answer phrase
                [NOTE.E5, Q * 8, E], [NOTE.G5, Q * 8 + E, E], [NOTE.A5, Q * 9, Q],
                [NOTE.C6, Q * 10, E], [NOTE.B5, Q * 10 + E, E], [NOTE.A5, Q * 11, Q],
                // Bar 7-8: descend home
                [NOTE.G5, Q * 12, E], [NOTE.F5, Q * 12 + E, E], [NOTE.E5, Q * 13, Q],
                [NOTE.D5, Q * 14, E], [NOTE.C5, Q * 14 + E, E], [NOTE.C5, Q * 15, Q + E],
                // Bar 9-12: second theme (punchier)
                [NOTE.G5, Q * 16, S], [NOTE.A5, Q * 16 + S, S], [NOTE.G5, Q * 16 + E, Q],
                [NOTE.E5, Q * 17 + E, Q], [NOTE.C5, Q * 18, Q], [NOTE.D5, Q * 19, Q + E],
                [NOTE.F5, Q * 20, S], [NOTE.G5, Q * 20 + S, S], [NOTE.F5, Q * 20 + E, Q],
                [NOTE.D5, Q * 21 + E, Q], [NOTE.B4, Q * 22, Q], [NOTE.C5, Q * 23, Q + E],
                // Bar 13-14: flourish run
                [NOTE.C5, Q * 24, S], [NOTE.D5, Q * 24 + S, S], [NOTE.E5, Q * 24 + E, S], [NOTE.F5, Q * 24 + E + S, S],
                [NOTE.G5, Q * 25, Q], [NOTE.A5, Q * 25 + E, Q], [NOTE.G5, Q * 26, Q], [NOTE.F5, Q * 27, Q + E],
                // Bar 15-16: resolve
                [NOTE.E5, Q * 28, E], [NOTE.G5, Q * 28 + E, E], [NOTE.C6, Q * 29, Q + E],
                [NOTE.B5, Q * 30 + E, E], [NOTE.A5, Q * 31, E], [NOTE.G5, Q * 31 + E, E],
            ];

            // ── BASS LINE ──
            const BASS = [
                [NOTE.C3, 0, E], [NOTE.G3, E, S], [NOTE.C3, Q, E], [NOTE.G3, Q + E, S],
                [NOTE.C3, Q * 2, E], [NOTE.G3, Q * 2 + E, S], [NOTE.C3, Q * 3, E], [NOTE.G3, Q * 3 + E, S],
                [NOTE.F3, Q * 4, E], [NOTE.C3, Q * 4 + E, S], [NOTE.F3, Q * 5, E], [NOTE.C3, Q * 5 + E, S],
                [NOTE.G3, Q * 6, E], [NOTE.D3, Q * 6 + E, S], [NOTE.G3, Q * 7, E], [NOTE.D3, Q * 7 + E, S],
                // repeat pattern for bars 5-8
                [NOTE.C3, Q * 8, E], [NOTE.G3, Q * 8 + E, S], [NOTE.C3, Q * 9, E], [NOTE.G3, Q * 9 + E, S],
                [NOTE.A3, Q * 10, E], [NOTE.E3, Q * 10 + E, S], [NOTE.A3, Q * 11, E], [NOTE.E3, Q * 11 + E, S],
                [NOTE.F3, Q * 12, E], [NOTE.C3, Q * 12 + E, S], [NOTE.G3, Q * 13, E], [NOTE.D3, Q * 13 + E, S],
                [NOTE.C3, Q * 14, E], [NOTE.G2, Q * 14 + E, S], [NOTE.C3, Q * 15, Q + E],
                // bars 9-16 bass
                [NOTE.C3, Q * 16, E], [NOTE.G3, Q * 16 + E, S], [NOTE.C3, Q * 17, E], [NOTE.G3, Q * 17 + E, S],
                [NOTE.C3, Q * 18, E], [NOTE.G3, Q * 18 + E, S], [NOTE.C3, Q * 19, Q + E],
                [NOTE.F3, Q * 20, E], [NOTE.C3, Q * 20 + E, S], [NOTE.F3, Q * 21, E], [NOTE.C3, Q * 21 + E, S],
                [NOTE.G3, Q * 22, E], [NOTE.D3, Q * 22 + E, S], [NOTE.G3, Q * 23, Q + E],
                [NOTE.C3, Q * 24, E], [NOTE.G3, Q * 24 + E, S], [NOTE.C3, Q * 25, E], [NOTE.G3, Q * 25 + E, S],
                [NOTE.F3, Q * 26, E], [NOTE.C3, Q * 26 + E, S], [NOTE.G3, Q * 27, E], [NOTE.D3, Q * 27 + E, S],
                [NOTE.C3, Q * 28, E], [NOTE.G3, Q * 28 + E, S], [NOTE.C3, Q * 29, Q + E],
                [NOTE.G3, Q * 30, E], [NOTE.D3, Q * 30 + E, S], [NOTE.C3, Q * 31, Q + E],
            ];

            // ── CHORD PADS (soft harmonics) ──
            const PADS = [
                // C major
                [NOTE.C4, 0, Q * 4], [NOTE.E4, 0, Q * 4], [NOTE.G4, 0, Q * 4],
                // F major
                [NOTE.F4, Q * 4, Q * 4], [NOTE.A4, Q * 4, Q * 4], [NOTE.C5, Q * 4, Q * 4],
                // G major
                [NOTE.G4, Q * 8, Q * 4], [NOTE.B4, Q * 8, Q * 4], [NOTE.D5, Q * 8, Q * 4],
                // A minor
                [NOTE.A4, Q * 12, Q * 4], [NOTE.C5, Q * 12, Q * 4], [NOTE.E5, Q * 12, Q * 4],
                // C major
                [NOTE.C4, Q * 16, Q * 4], [NOTE.E4, Q * 16, Q * 4], [NOTE.G4, Q * 16, Q * 4],
                // F major
                [NOTE.F4, Q * 20, Q * 4], [NOTE.A4, Q * 20, Q * 4], [NOTE.C5, Q * 20, Q * 4],
                // G major → C
                [NOTE.G4, Q * 24, Q * 4], [NOTE.B4, Q * 24, Q * 4], [NOTE.D5, Q * 24, Q * 4],
                [NOTE.C4, Q * 28, Q * 4], [NOTE.E4, Q * 28, Q * 4], [NOTE.G4, Q * 28, Q * 4],
            ];

            // Total loop length
            const LOOP_BARS = 32;
            const LOOP_LENGTH = LOOP_BARS * Q;

            function getMusicCtx() {
                if (!musicCtx) {
                    musicCtx = new (window.AudioContext || window.webkitAudioContext)();
                    masterGain = musicCtx.createGain();
                    masterGain.gain.value = 0.55;
                    masterGain.connect(musicCtx.destination);
                }
                if (musicCtx.state === 'suspended') musicCtx.resume();
                return musicCtx;
            }

            function scheduleNote(freq, startTime, duration, type, vol, ac) {
                const osc = ac.createOscillator();
                const g = ac.createGain();
                osc.connect(g);
                g.connect(masterGain);
                osc.type = type;
                osc.frequency.value = freq;
                const att = 0.015, rel = Math.min(0.08, duration * 0.3);
                g.gain.setValueAtTime(0, startTime);
                g.gain.linearRampToValueAtTime(vol, startTime + att);
                g.gain.setValueAtTime(vol, startTime + duration - rel);
                g.gain.linearRampToValueAtTime(0, startTime + duration);
                osc.start(startTime);
                osc.stop(startTime + duration + 0.02);
                scheduledNodes.push(osc);
            }

            function scheduleLoop(loopStart) {
                const ac = getMusicCtx();

                // Melody — bright triangle
                MELODY.forEach(([freq, beat, dur]) => {
                    scheduleNote(freq, loopStart + beat, dur, 'triangle', 0.22, ac);
                    // Subtle octave below for warmth
                    scheduleNote(freq / 2, loopStart + beat, dur * 0.6, 'sine', 0.06, ac);
                });

                // Bass — fat sine + slight square
                BASS.forEach(([freq, beat, dur]) => {
                    scheduleNote(freq, loopStart + beat, dur, 'sine', 0.28, ac);
                    scheduleNote(freq, loopStart + beat, dur * 0.4, 'square', 0.06, ac);
                });

                // Pads — soft sine, very quiet
                PADS.forEach(([freq, beat, dur]) => {
                    const osc = ac.createOscillator();
                    const g = ac.createGain();
                    osc.connect(g); g.connect(masterGain);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    const t = loopStart + beat;
                    g.gain.setValueAtTime(0, t);
                    g.gain.linearRampToValueAtTime(0.07, t + 0.2);
                    g.gain.setValueAtTime(0.07, t + dur - 0.3);
                    g.gain.linearRampToValueAtTime(0, t + dur);
                    osc.start(t); osc.stop(t + dur + 0.05);
                    scheduledNodes.push(osc);
                });

                // Soft hi-hat tick every eighth note
                for (let i = 0; i < LOOP_BARS * 2; i++) {
                    const t = loopStart + i * E;
                    const bufSize = Math.floor(ac.sampleRate * 0.04);
                    const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
                    const d = buf.getChannelData(0);
                    for (let j = 0; j < bufSize; j++) d[j] = (Math.random() * 2 - 1);
                    const src = ac.createBufferSource();
                    src.buffer = buf;
                    const hpf = ac.createBiquadFilter();
                    hpf.type = 'highpass'; hpf.frequency.value = 8000;
                    const hg = ac.createGain();
                    hg.gain.setValueAtTime(i % 2 === 0 ? 0.07 : 0.04, t);
                    hg.gain.linearRampToValueAtTime(0, t + 0.04);
                    src.connect(hpf); hpf.connect(hg); hg.connect(masterGain);
                    src.start(t); src.stop(t + 0.05);
                    scheduledNodes.push(src);
                }

                // Kick on beats 1 & 3 of every bar
                for (let bar = 0; bar < LOOP_BARS; bar++) {
                    [0, Q * 2].forEach(offset => {
                        const t = loopStart + bar * Q * 4 + offset;
                        const osc = ac.createOscillator();
                        const g = ac.createGain();
                        osc.connect(g); g.connect(masterGain);
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(120, t);
                        osc.frequency.exponentialRampToValueAtTime(40, t + 0.12);
                        g.gain.setValueAtTime(0.35, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                        osc.start(t); osc.stop(t + 0.2);
                        scheduledNodes.push(osc);
                    });
                }

                // Schedule next loop slightly before end
                loopTimeout = setTimeout(() => {
                    if (playing) scheduleLoop(loopStart + LOOP_LENGTH);
                }, (LOOP_LENGTH - 0.5) * 1000);
            }

            function fadeOut(cb) {
                if (!masterGain) { cb && cb(); return; }
                const ac = getMusicCtx();
                masterGain.gain.setValueAtTime(masterGain.gain.value, ac.currentTime);
                masterGain.gain.linearRampToValueAtTime(0, ac.currentTime + 0.8);
                setTimeout(() => { cb && cb(); }, 900);
            }

            return {
                start() {
                    if (playing) return;
                    playing = true;
                    const ac = getMusicCtx();
                    masterGain.gain.setValueAtTime(0, ac.currentTime);
                    masterGain.gain.linearRampToValueAtTime(0.55, ac.currentTime + 1.2);
                    scheduleLoop(ac.currentTime + 0.1);
                },
                stop() {
                    playing = false;
                    clearTimeout(loopTimeout);
                    fadeOut(() => {
                        scheduledNodes.forEach(n => { try { n.stop(); } catch (e) { } });
                        scheduledNodes = [];
                    });
                },
                isPlaying() { return playing; }
            };
        })();
        window.TitleMusic = TitleMusic;
    </script>
